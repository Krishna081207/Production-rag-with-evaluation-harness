[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-hybrid-eval"
version = "0.2.0"
description = "A page-cited research paper assistant with hybrid retrieval and an evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "sentence-transformers>=3,<6",
    "qdrant-client>=1.10,<2",
    "rank-bm25>=0.2.2,<1",
    "groq>=0.9,<2",
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
    "streamlit>=1.42,<2",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
pinecone = ["pinecone>=5,<8"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
]

[project.urls]
Homepage = "https://github.com/Krishna081207/Production-rag-with-evaluation-harness"
Repository = "https://github.com/Krishna081207/Production-rag-with-evaluation-harness"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_hybrid", "rag_hybrid.src*", "rag_hybrid.eval*", "rag_hybrid.scripts*"]
exclude = ["rag_hybrid.tests*"]

[tool.setuptools.package-data]
"rag_hybrid.eval" = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["rag_hybrid/tests"]
addopts = "-vv --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
