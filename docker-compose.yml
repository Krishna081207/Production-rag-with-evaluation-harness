services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn rag_hybrid.src.api.app:app --host 0.0.0.0 --port 8000
    environment:
      VECTOR_DB: ${VECTOR_DB:-qdrant}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_PATH: /app/data/qdrant
      RAG_DATA_DIR: /app/data
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-rag-hybrid}
      PINECONE_CLOUD: ${PINECONE_CLOUD:-aws}
      PINECONE_REGION: ${PINECONE_REGION:-us-east-1}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    volumes:
      - rag_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run rag_hybrid/scripts/app_streamlit.py --server.port 8501 --server.address 0.0.0.0
    environment:
      RAG_API_URL: http://api:8000
      VECTOR_DB: ${VECTOR_DB:-qdrant}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-rag-hybrid}
      PINECONE_CLOUD: ${PINECONE_CLOUD:-aws}
      PINECONE_REGION: ${PINECONE_REGION:-us-east-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag_data:
