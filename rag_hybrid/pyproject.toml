[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_hybrid"
version = "0.1.0"
description = "Hybrid Retrieval‑Augmented Generation with evaluation harness"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sentence-transformers",
    "torch",
    "transformers",
    "qdrant-client",
    "elasticsearch",
    "openai",
    "tiktoken",
    "ragas",
    "rich"
]

[project.urls]
Homepage = "https://github.com/yourorg/rag_hybrid"
